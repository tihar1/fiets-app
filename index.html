<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideFuel - Jouw Voedingsplan</title>
    <style>
        :root { --primary: #e67e22; --bg: #f0f2f5; --card-bg: #ffffff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); padding: 10px; color: #333; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 20px; font-weight: 800; }
        
        .section { background: #fdfdfd; border: 1px solid #eee; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #666; }
        input, select { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }
        
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:active { transform: scale(0.98); }

        .total-display { text-align: center; padding: 15px; background: #34495e; color: white; border-radius: 15px; margin-bottom: 20px; }
        .total-kcal { font-size: 28px; font-weight: bold; display: block; }

        .meal { border-left: 5px solid var(--primary); padding: 15px; margin-bottom: 15px; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .meal-title { font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; margin-bottom: 8px; }
        .recipe { font-size: 14px; line-height: 1.6; color: #444; }
        .qty { font-weight: bold; color: #d35400; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚴‍♂️ RideFuel Pro</h2>

    <div class="section">
        <label>🕒 Wanneer fiets je?</label>
        <select id="moment">
            <option value="ochtend">Ochtend (na ontbijt)</option>
            <option value="middag">Middag (na lunch)</option>
            <option value="avond">Avond (na diner)</option>
        </select>

        <label>⚡ Gemiddeld Wattage</label>
        <input type="number" id="watt" value="200">

        <label>⏱️ Duur (minuten)</label>
        <input type="number" id="tijd" value="90">

        <label>🍝 Wat eet je bij het diner?</label>
        <select id="carbSource">
            <option value="pasta">Pasta</option>
            <option value="rijst">Basmatirijst</option>
            <option value="couscous">Couscous</option>
            <option value="wraps">Wraps</option>
            <option value="aardappels">Aardappels</option>
        </select>
    </div>

    <button onclick="calculatePlan()">Bereken Mijn Dag</button>

    <div id="output" style="display:none; margin-top:20px;">
        <div class="total-display">
            <span style="font-size: 14px; opacity: 0.8;">Totaal Dagdoel</span>
            <span class="total-kcal" id="totalKcal">0 kcal</span>
        </div>
        <div id="mealContainer"></div>
    </div>
</div>

<script>

    const watt = parseFloat(document.getElementById('watt').value) || 0;

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideFuel Pro v2</title>
    <style>
        :root { --primary: #e67e22; --secondary: #2980b9; --bg: #f4f7f9; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); padding: 15px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        
        /* Highlight de nieuwe keuze-box */
        .moment-box { background: #fff3e0; padding: 15px; border-radius: 12px; border: 2px solid var(--primary); margin-bottom: 20px; }
        
        .input-box { margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; background: white; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .summary { background: #e3f2fd; padding: 15px; border-radius: 12px; margin-top: 20px; text-align: center; border: 1px solid #bbdefb; }
        .total-kcal { font-size: 26px; font-weight: bold; color: #1976d2; }

        .meal-list { margin-top: 20px; }
        .meal-item { background: white; border-left: 5px solid #ccc; padding: 15px; margin-bottom: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .meal-item.pre { border-left-color: #f1c40f; background: #fffdf0; } /* Geel voor Brandstof */
        .meal-item.post { border-left-color: #2ecc71; background: #f0fff4; } /* Groen voor Herstel */
        .meal-title { font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .meal-kcal { color: var(--primary); font-size: 18px; }
        .meal-desc { font-size: 14px; color: #555; margin-top: 8px; line-height: 1.4; }
        .tag { font-size: 10px; text-transform: uppercase; background: #eee; padding: 2px 6px; border-radius: 4px; margin-left: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚴‍♂️ RideFuel Pro</h2>
    
    <div class="moment-box">
        <label>🕒 Wanneer ga je fietsen?</label>
        <select id="moment">
            <option value="ochtend">In de ochtend (na ontbijt)</option>
            <option value="middag">In de middag (na lunch)</option>
            <option value="avond">In de avond (na diner)</option>
        </select>
    </div>

    <div class="input-box">
        <label>Gepland Vermogen (Watt)</label>
        <input type="number" id="watt" placeholder="Bijv. 200">
    </div>

    <div class="input-box">
        <label>Duur (minuten)</label>
        <input type="number" id="tijd" placeholder="Bijv. 90">
    </div>

    <button onclick="generatePlan()">Genereer Dagplanning</button>

    <div id="results" style="display:none;">
        <div class="summary">
            <div>Totaal budget voor vandaag:</div>
            <div class="total-kcal"><span id="totalDisplay">0</span> kcal</div>
            <div style="font-size: 12px; color: #666;">(1800 BMR + sport-verbruik)</div>
        </div>

        <div class="meal-list" id="mealList"></div>
    </div>
</div>

<script>
function generatePlan() {
    const bmr = 1800;
    const watt = parseFloat(document.getElementById('watt').value) || 0;
    const min = parseFloat(document.getElementById('tijd').value) || 0;
    const moment = document.getElementById('moment').value;
    
    const sportKcal = Math.round(watt * (min / 60) * 3.6);
    const totalKcal = bmr + sportKcal;
    
    document.getElementById('totalDisplay').innerText = totalKcal;
    document.getElementById('results').style.display = 'block';

    const meals = [
        { id: 'ontbijt', name: "🍳 Ontbijt", basePct: 0.20, type: 'normal' },
        { id: 'osnack', name: "🍎 Ochtendsnack", basePct: 0.08, type: 'normal' },
        { id: 'lunch', name: "🥪 Lunch", basePct: 0.25, type: 'normal' },
        { id: 'msnack', name: "🍌 Middagsnack", basePct: 0.08, type: 'normal' },
        { id: 'diner', name: "🍝 Diner", basePct: 0.30, type: 'normal' },
        { id: 'asnack', name: "🍫 Avondsnack", basePct: 0.09, type: 'normal' }
    ];

    // Bepaal welke maaltijden 'Pre' en 'Post' zijn
    if (moment === 'ochtend') { meals[0].type = 'pre'; meals[1].type = 'post'; }
    else if (moment === 'middag') { meals[2].type = 'pre'; meals[3].type = 'post'; }
    else if (moment === 'avond') { meals[4].type = 'pre'; meals[5].type = 'post'; }

    const container = document.getElementById('mealList');
    container.innerHTML = "";

    meals.forEach(m => {
        let kcal = Math.round(totalKcal * m.basePct);
        let suggestie = "";
        let className = "meal-item " + m.type;
        let tag = m.type === 'pre' ? '<span class="tag" style="background:#f1c40f">Brandstof</span>' : (m.type === 'post' ? '<span class="tag" style="background:#2ecc71; color:white;">Herstel</span>' : '');

        if (m.type === 'pre') {
            suggestie = `<b>Brandstof:</b> ${Math.round(kcal/4)}g havermout of pannenkoeken met stroop. Weinig vetten, focus op snelle energie.`;
        } else if (m.type === 'post') {
            suggestie = `<b>Herstel:</b> ${Math.round(kcal/6)}g kwark of een omelet met 2 sneden brood. Voeg wat fruit toe voor suikers.`;
        } else {
            if (m.name.includes("Diner")) suggestie = `<b>Basis:</b> ${Math.round(kcal/7)}g pasta/rijst (ongekookt gewogen) met mager vlees of vervanger en veel groenten.`;
            else if (m.name.includes("Lunch")) suggestie = `<b>Basis:</b> 3 volkoren boterhammen met gezond beleg (kaas/hummus/kip).`;
            else suggestie = `<b>Snack:</b> Een handje noten of een eiwitrijke reep.`;
        }

        container.innerHTML += `
            <div class="${className}">
                <div class="meal-title">
                    <span>${m.name} ${tag}</span>
                    <span class="meal-kcal">${kcal} kcal</span>
                </div>
                <div class="meal-desc">${suggestie}</div>
            </div>
        `;
    });
}
</script>

</body>
</html>

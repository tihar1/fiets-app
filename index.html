<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideFuel Pro</title>
    <style>
        :root { --primary: #e67e22; --bg: #f8f9fa; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); padding: 15px; color: #333; line-height: 1.4; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); max-width: 500px; margin: auto; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        .input-box { margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .summary { background: #fff3e0; padding: 15px; border-radius: 12px; margin-top: 20px; text-align: center; border: 1px solid #ffe0b2; }
        .total-kcal { font-size: 24px; font-weight: bold; color: #d35400; }

        .meal-list { margin-top: 20px; }
        .meal-item { background: white; border-left: 5px solid var(--primary); padding: 12px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .meal-title { font-weight: bold; color: #555; display: flex; justify-content: space-between; }
        .meal-kcal { color: var(--primary); }
        .meal-desc { font-size: 13px; color: #777; margin-top: 4px; }

        .on-bike { background: #e3f2fd; border-left: 5px solid #2196f3; padding: 12px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚴‍♂️ RideFuel Pro</h2>
    
    <div class="input-box">
        <label>Gepland Wattage (Gemiddeld)</label>
        <input type="number" id="watt" placeholder="Bijv. 200">
    </div>
    <div class="input-box">
        <label>Tijd op de fiets (minuten)</label>
        <input type="number" id="tijd" placeholder="Bijv. 90">
    </div>
    <button onclick="updatePlanning()">Genereer Dagplanning</button>

    <div id="results" style="display:none;">
        <div class="summary">
            <div>Totaal budget vandaag (incl. rust):</div>
            <div class="total-kcal"><span id="totalDisplay">0</span> kcal</div>
            <div style="font-size: 12px; color: #666;">(1800 BMR + <span id="sportDisplay">0</span> sport)</div>
        </div>

        <div class="on-bike" id="onBikeSection">
            <strong>🍼 Tijdens de rit:</strong><br>
            <span id="onBikeText"></span>
        </div>

        <div class="meal-list" id="mealList">
            </div>
    </div>
</div>

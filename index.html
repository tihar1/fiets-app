<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RideFuel V3</title>
    <style>
        :root { --p: #e67e22; --bg: #f4f7f6; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        .box { background: #fff9f0; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #ffe0b2; }
        label { display: block; font-weight: bold; font-size: 12px; color: #888; margin-bottom: 4px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; margin-bottom: 12px; }
        button { width: 100%; background: var(--p); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        #debug { text-align: center; font-size: 10px; color: green; margin-top: 5px; }
        
        .res-card { display: none; margin-top: 20px; }
        .total { background: #2c3e50; color: white; text-align: center; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .fuel { background: #e1f5fe; padding: 10px; border-radius: 10px; border-left: 5px solid #03a9f4; margin-bottom: 15px; font-size: 14px; }
        .meal { background: white; border-left: 5px solid var(--p); padding: 12px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .m-head { font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 5px; }
        .qty { font-weight: bold; color: #d35400; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; color:var(--p);">🚴‍♂️ RideFuel Pro</h2>
    
    <div class="box">
        <label>WANNEER FIETS JE?</label>
        <select id="ritMoment">
            <option value="ochtend">Ochtend</option>
            <option value="middag">Middag</option>
            <option value="avond">Avond</option>
        </select>

        <label>WATTAGE</label>
        <input type="number" id="inWatt" value="200">

        <label>MINUTEN</label>
        <input type="number" id="inMin" value="60">

        <label>DINER BASIS</label>
        <select id="inDiner">
            <option value="Pasta">Pasta</option>
            <option value="Basmatirijst">Basmatirijst</option>
            <option value="Couscous">Couscous</option>
            <option value="Wraps">Wraps</option>
            <option value="Aardappels">Aardappels</option>
        </select>
    </div>

    <button onclick="runCalculation()">BEREKEN PLANNING</button>
    <div id="debug">Systeem status: Actief v3</div>

    <div id="resCard" class="res-card">
        <div class="total">
            <small>TOTAAL BUDGET</small><br>
            <strong id="outTotaal" style="font-size:24px;">0 kcal</strong>
        </div>
        
        <div class="fuel" id="outFuel"></div>
        <div id="outLijst"></div>
    </div>
</div>

<script>
function runCalculation() {
    console.log("Start berekening...");
    
    // 1. Haal waarden op
    const bmr = 1800;
    const watt = parseFloat(document.getElementById('inWatt').value) || 0;
    const min = parseFloat(document.getElementById('inMin').value) || 0;
    const moment = document.getElementById('ritMoment').value;
    const dinerBasis = document.getElementById('inDiner').value;

    // 2. Bereken totaal
    const sportKcal = Math.round(watt * (min / 60) * 3.6);
    const totaal = bmr + sportKcal;

    // 3. Toon sectie
    document.getElementById('outTotaal').innerText = totaal + " kcal";
    document.getElementById('resCard').style.display = 'block';

    // 4. Fuel tijdens rit
    const carbUur = watt > 220 ? 80 : 60;
    const carbsTotaal = Math.round(carbUur * (min / 60));
    document.getElementById('outFuel').innerHTML = min < 45 ? 
        "<b>🍼 Tijdens rit:</b> Water" : 
        `<b>🍼 Tijdens rit:</b> Neem <span class="qty">${carbsTotaal}g koolhydraten</span> mee.`;

    // 5. Maaltijden genereren
    const schema = [
        { n: "🍳 Ontbijt", p: 0.20, t: "h" },
        { n: "🍎 Ochtend Snack", p: 0.10, t: "b" },
        { n: "🥪 Lunch", p: 0.22, t: "b" },
        { n: "🍌 Middag Snack", p: 0.10, t: "b" },
        { n: "🍝 Diner", p: 0.28, t: "d" },
        { n: "🍫 Avond Snack", p: 0.10, t: "k" }
    ];

    let html = "";
    schema.forEach((m, i) => {
        let kcal = Math.round(totaal * m.p);
        let detail = "";
        
        // Simpele recepten
        if(m.t === "h") {
            let gram = Math.max(30, Math.round((kcal - 370) / 3.7));
            detail = `Havermout: <span class="qty">${gram}g</span>. Basis: 250ml melk, 1 banaan, 15g pindakaas.`;
        } else if(m.t === "b") {
            let sneden = Math.round(kcal / 100);
            detail = `Boterhammen: <span class="qty">${sneden} stuks</span> met beleg.`;
        } else if(m.t === "d") {
            let q = "";
            if(dinerBasis === "Wraps") q = Math.round((kcal * 0.5) / 180) + " stuks";
            else if(dinerBasis === "Aardappels") q = Math.round((kcal * 0.5) / 0.8) + "g";
            else q = Math.round((kcal * 0.5) / 3.5) + "g (droog)";
            detail = `${dinerBasis}: <span class="qty">${q}</span>. + 150g eiwit & groenten.`;
        } else if(m.t === "k") {
            let extra = Math.round((kcal - 150) / 3.7);
            detail = `Kwark: <span class="qty">250g</span>.`;
            if(extra > 10) detail += ` + <span class="qty">${extra}g</span> havermout.`;
        }

        // Pre/Post Ride labels
        let label = "";
        if(moment === 'ochtend' && i === 0) label = " (PRE)";
        if(moment === 'ochtend' && i === 1) label = " (POST)";
        if(moment === 'middag' && i === 2) label = " (PRE)";
        if(moment === 'middag' && i === 3) label = " (POST)";
        if(moment === 'avond' && i === 4) label = " (PRE)";
        if(moment === 'avond' && i === 5) label = " (POST)";

        html += `<div class="meal">
            <div class="m-head"><span>${m.n}${label}</span> <span style="color:var(--p)">${kcal} kcal</span></div>
            <div style="font-size:13px; color:#666;">${detail}</div>
        </div>`;
    });

    document.getElementById('outLijst').innerHTML = html;
}
</script>

</body>
</html>

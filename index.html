<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideFuel - Calorie Calculator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        h2 { color: #e67e22; margin-top: 0; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: #e67e22; }
        button { width: 100%; background: #e67e22; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 10px; cursor: pointer; transition: background 0.3s; }
        button:active { background: #d35400; transform: scale(0.98); }
        .result-area { margin-top: 25px; padding: 20px; background: #fff3e0; border-radius: 12px; display: none; border-left: 5px solid #e67e22; }
        .kcal-val { font-size: 24px; font-weight: bold; color: #d35400; }
        .suggestion { margin-top: 10px; line-height: 1.5; color: #444; }
        hr { margin: 30px 0; border: 0; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚴‍♂️ RideFuel Tracker</h2>
    
    <div id="setup">
        <div class="input-group">
            <label>Gepland Wattage</label>
            <input type="number" id="watt" placeholder="Bijv. 200">
        </div>
        <div class="input-group">
            <label>Tijd (minuten)</label>
            <input type="number" id="tijd" placeholder="Bijv. 60">
        </div>
        <button onclick="bereken()">Bereken Maaltijd</button>
    </div>

    <div id="resultaat" class="result-area">
        <div>Je verbruik: <span class="kcal-val" id="kcalDisplay">0</span> kcal</div>
        <div class="suggestion" id="suggestieText"></div>
        
        <hr>
        <p style="font-size: 12px; color: #888;"><strong>Achteraf hercalculeren?</strong> Pas hierboven de waarden aan naar je Garmin/Strava data en druk opnieuw op de knop.</p>
    </div>
</div>

<script>
function bereken() {
    const w = document.getElementById('watt').value;
    const t = document.getElementById('tijd').value;
    
    if(w > 0 && t > 0) {
        const kcal = Math.round(w * (t / 60) * 3.6);
        document.getElementById('kcalDisplay').innerText = kcal;
        
        let msg = "";
        if(kcal < 400) msg = "🎯 <b>Herstel:</b> Neem een kleine snack zoals een banaan of 150g magere kwark.";
        else if(kcal < 800) msg = "🎯 <b>Maaltijd:</b> Een kom havermout of twee volkoren boterhammen met beleg.";
        else msg = "🎯 <b>Grote Maaltijd:</b> Focus op koolhydraten (pasta/rijst) en 20-30g eiwit voor spierherstel.";
        
        document.getElementById('suggestieText').innerHTML = msg;
        document.getElementById('resultaat').style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }
}
</script>

</body>
</html>

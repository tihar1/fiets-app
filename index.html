<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideFuel Pro</title>
    <style>
        :root { --primary: #e67e22; --bg: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); padding: 10px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        .setup { background: #fff3e0; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #ffe0b2; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #666; }
        input, select { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; background: white; -webkit-appearance: none; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .total-display { text-align: center; padding: 15px; background: #34495e; color: white; border-radius: 15px; margin: 20px 0; }
        .meal { border-left: 5px solid var(--primary); padding: 15px; margin-bottom: 15px; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .meal-title { font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 8px; }
        .qty { font-weight: bold; color: #d35400; }
        .recipe { font-size: 14px; line-height: 1.5; color: #444; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚴‍♂️ RideFuel Pro</h2>

    <div class="setup">
        <label>🕒 Wanneer fiets je?</label>
        <select id="moment">
            <option value="ochtend">Ochtend (na ontbijt)</option>
            <option value="middag">Middag (na lunch)</option>
            <option value="avond">Avond (na diner)</option>
        </select>

        <label>⚡ Wattage (Gemiddeld)</label>
        <input type="number" id="watt" value="200">

        <label>⏱️ Duur (minuten)</label>
        <input type="number" id="tijd" value="60">

        <label>🍝 Diner hoofdbestanddeel</label>
        <select id="carbSource">
            <option value="pasta">Pasta</option>
            <option value="basmatirijst">Basmatirijst</option>
            <option value="couscous">Couscous</option>
            <option value="wraps">Wraps</option>
            <option value="aardappels">Aardappels</option>
        </select>
    </div>

    <button type="button" onclick="berekenPlan()">BEREKEN MIJN DAG</button>

    <div id="resultaatSectie" style="display:none;">
        <div class="total-display">
            <span style="font-size:12px; opacity:0.8;">TOTAAL BUDGET</span><br>
            <span id="totaalKcalDisplay" style="font-size:24px; font-weight:bold;">0 kcal</span>
        </div>
        <div id="maaltijdLijst"></div>
    </div>
</div>

<script>

        { naam: "🍫 Avondsnack", pct: 0.10, type: "kwark" }

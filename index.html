<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RideFuel Ultimate</title>
    <style>
        :root { --primary: #e67e22; --blue: #2980b9; --bg: #f4f7f6; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); padding: 15px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 20px; font-weight: 800; }
        
        .input-group { background: #fff9f0; padding: 15px; border-radius: 15px; border: 1px solid #ffe0b2; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #7f8c8d; }
        input, select { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 16px; margin-bottom: 12px; background: white; }
        
        #btnBereken { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; }
        
        .total-box { text-align: center; background: #2c3e50; color: white; padding: 15px; border-radius: 15px; margin: 20px 0; }
        .fuel-box { background: #ebf5ff; border: 2px solid var(--blue); padding: 15px; border-radius: 15px; margin-bottom: 20px; color: #2c3e50; }
        
        .meal { border-left: 5px solid var(--primary); padding: 15px; margin-bottom: 15px; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .meal-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .kcal-label { color: var(--primary); }
        .recipe-text { font-size: 14px; line-height: 1.5; color: #555; }
        .bold-qty { font-weight: bold; color: #d35400; font-size: 16px; }
        .tag { font-size: 10px; background: #eee; padding: 2px 6px; border-radius: 4px; vertical-align: middle; margin-left: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚴‍♂️ RideFuel Pro</h2>

    <div class="input-group">
        <label>WANNEER FIETS JE?</label>
        <select id="moment">
            <option value="ochtend">Ochtend (na ontbijt)</option>
            <option value="middag">Middag (na lunch)</option>
            <option value="avond">Avond (na diner)</option>
        </select>

        <label>VERMOGEN (WATT)</label>
        <input type="number" id="watt" value="200">

        <label>DUUR (MINUTEN)</label>
        <input type="number" id="tijd" value="60">

        <label>DINER BASIS</label>
        <select id="dinerBasis">
            <option value="pasta">Pasta</option>
            <option value="rijst">Basmatirijst</option>
            <option value="couscous">Couscous</option>
            <option value="wraps">Wraps</option>
            <option value="aardappels">Aardappels</option>
        </select>
    </div>

    <button id="btnBereken" onclick="startBerekening()">BEREKEN MIJN DAG</button>

    <div id="resultaatSectie" style="display:none; margin-top:20px;">
        <div class="total-box">
            <span style="font-size:12px; opacity:0.8;">TOTAAL BUDGET VANDAAG</span><br>
            <span id="displayTotaalKcal" style="font-size:26px; font-weight:bold;">0 kcal</span>
        </div>

        <div class="fuel-box" id="onBikeFuel">
            </div>

        <div id="maaltijdLijst"></div>
    </div>
</div>
